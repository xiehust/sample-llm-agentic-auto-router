<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">LLM Agentic Auto Router</title>
  <desc id="d">Cache-aware model routing for coding agents on Amazon Bedrock AgentCore Gateway: an agent sends model auto, the router picks the fast, standard or frontier tier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="0.55" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#1d1145"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.77" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="1030" y1="180" x2="1146" y2="180">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="360">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#halo)"/>

  <!-- text block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="14" font-weight="600" letter-spacing="3.2" fill="#7dd3fc">AMAZON BEDROCK  ·  AGENTCORE GATEWAY</text>
    <text x="70" y="160" font-size="52" font-weight="700" fill="url(#title)">LLM Agentic Auto Router</text>
    <text x="72" y="204" font-size="22" fill="#c7d2fe">Cache-aware model routing for coding agents</text>
    <text x="72" y="236" font-size="16" fill="#94a3b8">Switches models only at cache break points · downgrades must pay for a cold cache</text>
    <g font-size="14" font-weight="600">
      <rect x="72" y="266" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#7dd3fc" stroke-opacity="0.55"/>
      <text x="160" y="288" text-anchor="middle" fill="#e0f2fe">Anthropic Messages</text>
      <rect x="260" y="266" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#a5b4fc" stroke-opacity="0.55"/>
      <text x="358" y="288" text-anchor="middle" fill="#e0e7ff">OpenAI Chat Completions</text>
      <rect x="468" y="266" width="164" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.55"/>
      <text x="550" y="288" text-anchor="middle" fill="#ede9fe">OpenAI Responses</text>
    </g>
  </g>

  <!-- routing diagram -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- agent → router -->
    <path d="M884 180 H938" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" fill="none"/>
    <!-- router → tiers -->
    <path d="M1030 180 C1080 180 1090 100 1146 100" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 7" fill="none"/>
    <path d="M1030 180 H1146" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M1030 180 H1146" stroke="url(#hot)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M1030 180 C1080 180 1090 260 1146 260" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 7" fill="none"/>

    <!-- agent node -->
    <rect x="812" y="150" width="72" height="60" rx="14" fill="#0f172a" stroke="#7dd3fc" stroke-opacity="0.8" stroke-width="1.5"/>
    <text x="830" y="186" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" fill="#7dd3fc">&gt;_</text>
    <text x="848" y="234" text-anchor="middle" font-size="13" fill="#94a3b8">agent</text>

    <!-- router node -->
    <circle cx="984" cy="180" r="50" fill="url(#core)" opacity="0.22" filter="url(#glow)"/>
    <circle cx="984" cy="180" r="40" fill="#0f172a" stroke="url(#core)" stroke-width="3"/>
    <text x="984" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">auto</text>
    <text x="984" y="246" text-anchor="middle" font-size="13" fill="#94a3b8">router</text>

    <!-- tiers -->
    <g font-size="14" font-weight="600">
      <rect x="1146" y="82" width="104" height="36" rx="18" fill="#2e1065" stroke="#a78bfa" stroke-opacity="0.8"/>
      <text x="1198" y="105" text-anchor="middle" fill="#ddd6fe">frontier</text>
      <rect x="1146" y="162" width="104" height="36" rx="18" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <text x="1198" y="185" text-anchor="middle" fill="#e0f2fe">standard</text>
      <rect x="1146" y="242" width="104" height="36" rx="18" fill="#134e4a" stroke="#5eead4" stroke-opacity="0.8"/>
      <text x="1198" y="265" text-anchor="middle" fill="#ccfbf1">fast</text>
    </g>
    <text x="1140" y="168" text-anchor="end" font-size="12" fill="#7dd3fc" fill-opacity="0.9">cache warm</text>
  </g>
</svg>
