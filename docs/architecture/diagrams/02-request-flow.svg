<rect data-graph-role="background" width="1500" height="1420" fill="#ffffff"/>
<text data-graph-role="label" x="750.0" y="46" font-size="24" fill="#111827" text-anchor="middle" font-weight="700">请求路径：Gateway → 私有 REST API hop → router → Bedrock</text>
<text data-graph-role="label" x="750.0" y="76" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">以 Messages 为例；Chat Completions / Responses 路径相同，只是上游路径为 /openai/v1/…</text>
