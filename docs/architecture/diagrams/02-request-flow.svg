<g data-graph-role="node" id="p-client" data-graph-bounds="16.0 108 184.0 166"><rect x="16.0" y="108" width="168" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="100" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Agent 客户端</text><text x="100" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Claude Code / OpenAI SDK</text></g>
<g data-graph-role="node" id="p-gw" data-graph-bounds="202.0 108 370.0 166"><rect x="202.0" y="108" width="168" height="58" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="286" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">AgentCore Gateway</text><text x="286" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">CUSTOM_JWT · rules</text></g>
<g data-graph-role="node" id="p-pe" data-graph-bounds="388.0 108 556.0 166"><rect x="388.0" y="108" width="168" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="472" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">托管私有端点</text><text x="472" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">managed private endpoint</text></g>
<g data-graph-role="node" id="p-vpce" data-graph-bounds="574.0 108 742.0 166"><rect x="574.0" y="108" width="168" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="658" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">execute-api VPCE</text><text x="658" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">interface endpoint</text></g>
<g data-graph-role="node" id="p-api" data-graph-bounds="760.0 108 928.0 166"><rect x="760.0" y="108" width="168" height="58" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/><text x="844" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">私有 REST API</text><text x="844" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">AWS_IAM + resource policy</text></g>
<g data-graph-role="node" id="p-nlb" data-graph-bounds="946.0 108 1114.0 166"><rect x="946.0" y="108" width="168" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="1030" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">VPC link → NLB</text><text x="1030" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">internal · TCP 8080</text></g>
<g data-graph-role="node" id="p-router" data-graph-bounds="1132.0 108 1300.0 166"><rect x="1132.0" y="108" width="168" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="1216" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">router (Fargate)</text><text x="1216" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">core + pricing</text></g>
<g data-graph-role="node" id="p-bedrock" data-graph-bounds="1318.0 108 1486.0 166"><rect x="1318.0" y="108" width="168" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="1402" y="133" font-size="14" fill="#111827" text-anchor="middle" font-weight="600">Bedrock runtime</text><text x="1402" y="152" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">/anthropic · /openai</text></g>
<rect data-graph-role="decoration" x="16" y="190" width="1468" height="410" rx="10" fill="#eff6ff" opacity="0.35"/>
<text data-graph-role="label" x="28" y="208" font-size="12" fill="#475569" text-anchor="start" font-weight="600">① 入站与 hop：身份在每一跳被重新校验</text>
<rect data-graph-role="decoration" x="16" y="610" width="1468" height="380" rx="10" fill="#f0fdf4" opacity="0.35"/>
<text data-graph-role="label" x="28" y="628" font-size="12" fill="#475569" text-anchor="start" font-weight="600">② router 内部：决策、转发、计量</text>
<rect data-graph-role="decoration" x="16" y="1000" width="1468" height="335" rx="10" fill="#fef2f2" opacity="0.35"/>
<text data-graph-role="label" x="28" y="1018" font-size="12" fill="#475569" text-anchor="start" font-weight="600">③ 回退：router 不可用时 gateway 按回退链直连 Bedrock（router 不参与）</text>
<path data-graph-role="edge" data-source="client" data-target="gw" d="M 104 250 L 280 250" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="227.60000000000028" y="242" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">POST /inference/v1/messages · Bearer JWT · model=router/auto</text>
<g data-graph-role="node" data-graph-bounds="296 266 586 316"><rect x="296" y="266" width="290" height="50" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="306" y="288" font-size="12" fill="#374151" text-anchor="start" font-weight="400">校验 JWT（issuer · client · scope）</text><text x="306" y="306" font-size="12" fill="#374151" text-anchor="start" font-weight="400">rule: model auto / auto:* → router target</text></g>
<path data-graph-role="edge" data-source="gw" data-target="pe" d="M 290 350 L 466 350" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="379.0" y="342" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">SigV4 (execute-api)</text>
<path data-graph-role="edge" data-source="pe" data-target="vpce" d="M 476 396 L 652 396" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="565.0" y="388" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">routingDomain</text>
<path data-graph-role="edge" data-source="vpce" data-target="api" d="M 662 442 L 838 442" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="751.0" y="434" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">Host = 私有 API 域名</text>
<g data-graph-role="node" data-graph-bounds="854 458 1214 544"><rect x="854" y="458" width="360" height="86" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="864" y="480" font-size="12" fill="#374151" text-anchor="start" font-weight="400">AWS_IAM 验签 + resource policy：只放行 gateway role，</text><text x="864" y="498" font-size="12" fill="#374151" text-anchor="start" font-weight="400">且 aws:SourceVpce = 本 VPCE（其他角色显式 Deny）</text><text x="864" y="516" font-size="12" fill="#374151" text-anchor="start" font-weight="400">注入 x-router-caller-arn / x-router-source-vpce</text><text x="864" y="534" font-size="12" fill="#374151" text-anchor="start" font-weight="400">（取自 context.identity，客户端伪造值被覆盖）</text></g>
<path data-graph-role="edge" data-source="api" data-target="nlb" d="M 848 578 L 1024 578" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="937.0" y="570" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">HTTP_PROXY · STREAM</text>
<path data-graph-role="edge" data-source="nlb" data-target="router" d="M 1034 624 L 1210 624" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="1123.0" y="616" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">TCP 8080（SG 只放行 NLB）</text>
<g data-graph-role="node" data-graph-bounds="736 650 1206 754"><rect x="736" y="650" width="470" height="104" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="746" y="672" font-size="12" fill="#374151" text-anchor="start" font-weight="400">1. hop 校验 apigw-iam（fail-closed）：caller ARN 是 gateway</text><text x="746" y="690" font-size="12" fill="#374151" text-anchor="start" font-weight="400">    role session、源 VPCE 匹配、x-amz-source-arn = gateway</text><text x="746" y="708" font-size="12" fill="#374151" text-anchor="start" font-weight="400">2. body 校验：≤ 10 MiB、合法 JSON、无重复顶层 key、pin 在允许列表</text><text x="746" y="726" font-size="12" fill="#374151" text-anchor="start" font-weight="400">3. summarize → decide（可选 assessor）→ beta 兼容性 veto</text><text x="746" y="744" font-size="12" fill="#374151" text-anchor="start" font-weight="400">4. 只改写顶层 model 字段，其余字节不动</text></g>
<path data-graph-role="edge" data-source="router" data-target="bedrock" d="M 1220 788 L 1396 788" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
<text data-graph-role="label" x="1309.0" y="780" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">SigV4 (bedrock) · 选中的模型</text>
<path data-graph-role="edge" data-source="bedrock" data-target="router" d="M 1398 834 L 1222 834" stroke="#10b981" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowGreen)"/>
<text data-graph-role="label" x="1309.0" y="826" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">SSE 事件流（含 usage）</text>
<path data-graph-role="edge" data-source="router" data-target="client" d="M 1212 880 L 106 880" stroke="#10b981" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowGreen)"/>
<text data-graph-role="label" x="658.0" y="872" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">逐块转发 SSE（反向经 NLB → API → Gateway）+ x-router-decision / -model / -reason</text>
<g data-graph-role="node" data-graph-bounds="866 896 1206 946"><rect x="866" y="896" width="340" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="876" y="918" font-size="12" fill="#374151" text-anchor="start" font-weight="400">流结束：normalize usage → costOf → core.record</text><text x="876" y="936" font-size="12" fill="#374151" text-anchor="start" font-weight="400">→ JSON 日志 + EMF（不记 body / 凭证）</text></g>
<path data-graph-role="edge" data-source="router" data-target="gw" d="M 1212 1062 L 292 1062" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
<text data-graph-role="label" x="751.0" y="1054" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">5XX / 连接失败 / 610 s 内无首字节（router 的 4XX 直接返回客户端）</text>
<path data-graph-role="edge" data-source="gw" data-target="bedrock" d="M 290 1108 L 1396 1108" stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arrowRed)"/>
<text data-graph-role="label" x="844.0" y="1100" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">fallback 1 → bedrock target：固定 Sonnet 5.5</text>
<path data-graph-role="edge" data-source="bedrock" data-target="gw" d="M 1398 1154 L 292 1154" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
<text data-graph-role="label" x="844.0" y="1146" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">4XX（Chat / Responses 请求必然如此：这些 API 不接受 Claude）</text>
<path data-graph-role="edge" data-source="gw" data-target="bedrock" d="M 290 1200 L 1396 1200" stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arrowRed)"/>
<text data-graph-role="label" x="844.0" y="1192" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">fallback 2 → bedrock target：固定 GPT-6.1 Sol</text>
<path data-graph-role="edge" data-source="bedrock" data-target="client" d="M 1398 1246 L 106 1246" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-dasharray="7,5" marker-end="url(#arrowRed)"/>
<text data-graph-role="label" x="751.0" y="1238" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="400">响应经 Gateway 返回（只能从 body.model 看出走了回退；两跳都失败则返回最后一个错误）</text>
<g data-graph-role="node" data-graph-bounds="296 1264 626 1314"><rect x="296" y="1264" width="330" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/><text x="306" y="1286" font-size="12" fill="#374151" text-anchor="start" font-weight="400">熔断：router 连续 5xx 时 gateway 可能把它摘掉，</text><text x="306" y="1304" font-size="12" fill="#374151" text-anchor="start" font-weight="400">auto* 流量静默走回退链，期间没有 router 计量</text></g>
<g data-graph-role="legend"><line x1="40" y1="1380" x2="76" y2="1380" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrowBlue)"/><text x="86" y="1384" font-size="12" fill="#6b7280">请求</text></g>
<g data-graph-role="legend"><line x1="210" y1="1380" x2="246" y2="1380" stroke="#10b981" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrowGreen)"/><text x="256" y="1384" font-size="12" fill="#6b7280">响应 / 流</text></g>
<g data-graph-role="legend"><line x1="380" y1="1380" x2="416" y2="1380" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrowRed)"/><text x="426" y="1384" font-size="12" fill="#6b7280">回退路径</text></g>
<text data-graph-role="label" x="1460" y="1384" font-size="11" fill="#9ca3af" text-anchor="end" font-weight="400">Style 1 · Flat Icon · sequence</text>
